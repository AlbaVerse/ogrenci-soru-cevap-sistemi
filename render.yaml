services:
  - type: web
    name: albaverse-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py loaddata mevzuat_seed.json"
    startCommand: "gunicorn alba_verse.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL        # Render PostgreSQL "Internal Database URL"
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL  # Resend'de DOĞRULANMIŞ alan adından, ör. "AlbaVerse <no-reply@alanadiniz.com>"
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        value: ostimteknik.edu.tr
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS  # frontend'in yayın adresi(leri), virgülle ayrılmış
        sync: false
